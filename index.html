<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Morning Routine (OLED Black)</title>
		<style>
:root {
	--bg: #000000;
	--card: #000000;
	--text-main: #a1a1aa; /* Soft grey */
	--text-dim: #3f3f46;  /* Dark grey for finished */
	--primary-dim: #1e3a8a; /* Deep blue, low light */
	--border: #27272a;
	--radius: 16px;
}
* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
body { margin: 0; padding: 1rem; background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

header { width: 100%; max-width: 500px; margin: 0.5rem 0 1.5rem; text-align: left; }
h1 { margin: 0; font-size: 1.2rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

main { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 5rem; }

.list-row {
	background: var(--card);
	padding: 1.2rem;
	border-radius: var(--radius);
	display: flex;
	align-items: center;
	transition: all 0.25s ease;
	border: 1px solid var(--border);
}

		/* COMPLETED: Shrink and nearly disappear */
		.list-row.done {
			transform: scale(0.92);
			opacity: 0.3;
			border-color: transparent;
		}
		.list-row.done label {
			color: var(--text-dim);
			text-decoration: line-through;
		}

		/* ACTIVE: Scaled up with a very dim blue border */
		.list-row.active-task {
			transform: scale(1.05);
			border-color: var(--primary-dim);
			background: #050505;
			z-index: 10;
		}
		.active-task label {
			color: #ffffff;
			font-weight: 600;
		}

		input[type="checkbox"] {
			margin-right: 1.2rem;
			transform: scale(1.4);
			accent-color: var(--primary-dim);
			filter: brightness(0.7); /* Mutes the checkbox color */
		}

		label { flex: 1; cursor: pointer; font-size: 1.1rem; transition: color 0.3s; }

		footer { 
			width: 100%; 
			max-width: 500px; 
			position: fixed; 
			bottom: 0; 
			background: #000; 
			padding: 1rem 1rem 2rem; 
			border-top: 1px solid var(--border);
		}

		.progress-container { width: 100%; height: 4px; background: #111; border-radius: 2px; margin-bottom: 1.5rem; }
		#progress-fill { height: 100%; background: var(--primary-dim); width: 0%; transition: width 0.4s; }

		.action-row { display: flex; gap: 1rem; }
		button.action { 
			flex: 1; 
			background: #111; 
			color: var(--text-dim); 
			border: 1px solid var(--border); 
			border-radius: 8px; 
			padding: 0.6rem; 
			font-size: 0.8rem;
			cursor: pointer; 
		}
		</style>
	</head>
	<body>

		<header>
			<h1>Routine</h1>
		</header>

		<main id="checklist"></main>

		<footer>
			<div class="progress-container"><div id="progress-fill"></div></div>
			<div class="action-row">
				<button class="action" id="btnReset">Reset Progress</button>
			</div>
		</footer>

		<script>
			const STORE_KEY = 'morning_v3_blackout';
			const ITEMS = [
				{ id: 'wake', text: 'Wake up' },
				{ id: 'phone', text: 'Grab your phone' },
				{ id: 'check_here', text: 'Check off to here' },
				{ id: 'out_bed', text: 'Get out of bed' },
				{ id: 'clothes', text: "Yesterday's clothes" },
				{ id: 'crocs', text: 'Slip on house crocs' },
				{ id: 'bathroom', text: 'Go to half bathroom' },
				{ id: 'water1', text: 'Drink metallic mug of water' },
				{ id: 'teeth', text: 'Brush teeth' },
				{ id: 'kitchen', text: 'Go to kitchen' },
				{ id: 'water2', text: 'Get another metallic mug' },
				{ id: 'office', text: 'Go to office' },
				{ id: 'bike', text: 'Move bike near desk' },
				{ id: 'desk_water', text: 'Put water on desk' },
				{ id: 'headphones', text: 'Grab wireless headphones' },
				{ id: 'cardio', text: '30m Cardio' }
			];

			const checklistEl = document.getElementById('checklist');
			const progressFill = document.getElementById('progress-fill');

			function save(ids) { localStorage.setItem(STORE_KEY, JSON.stringify(ids)); }
			function load() { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }

			function updateUI() {
				const checkedElements = Array.from(document.querySelectorAll('input:checked'));
				let checkedIds = checkedElements.map(el => el.id);

				// Automatic logic for "Check off to here"
				if (checkedIds.includes('check_here') && (!checkedIds.includes('wake') || !checkedIds.includes('phone'))) {
					document.getElementById('wake').checked = true;
					document.getElementById('phone').checked = true;
					checkedIds = Array.from(document.querySelectorAll('input:checked')).map(el => el.id);
				}

				save(checkedIds);

				const rows = document.querySelectorAll('.list-row');
				let foundActive = false;

				rows.forEach(row => {
					const cb = row.querySelector('input');
					row.classList.remove('done', 'active-task');

					if (cb.checked) {
						row.classList.add('done');
					} else if (!foundActive) {
						row.classList.add('active-task');
						foundActive = true;
					}
				});

				progressFill.style.width = (checkedIds.length / ITEMS.length * 100) + '%';
			}

			function render() {
				const state = load();
				checklistEl.innerHTML = ITEMS.map(it => `
					<div class="list-row">
					<input type="checkbox" id="${it.id}" ${state.includes(it.id) ? 'checked' : ''}>
					<label for="${it.id}">${it.text}</label>
					</div>
					`).join('');
				updateUI();
			}

					checklistEl.addEventListener('change', updateUI);
					document.getElementById('btnReset').onclick = () => { if(confirm('Reset all?')) { save([]); render(); } };

					render();
		</script>

	</body>
</html>
